<!DOCTYPE html>
<html>

<head>
    <title>Flask Sample Project</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="bg-gradient-to-br from-indigo-100 via-purple-50 to-pink-100 min-h-screen flex items-center justify-center p-4">
    <div
        class="max-w-md w-full bg-white/80 backdrop-blur-lg rounded-3xl shadow-2xl p-8 space-y-6 border border-white/20">
        <!-- Header with name -->
        <div class="text-center">
            <div class="inline-block p-3 bg-gradient-to-r from-blue-500 to-purple-500 rounded-full mb-4">
                <svg class="h-8 w-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z">
                    </path>
                </svg>
            </div>
            <h1 class="text-4xl font-bold text-gray-800 mb-2">
                Hello
                <span class="bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">{{ name
                    }}</span>
                <span class="inline-block animate-bounce">👋</span>
            </h1>
            <p class="text-gray-500 text-sm">Welcome to Flask with Tailwind CSS</p>
            <div class="h-1 w-20 bg-gradient-to-r from-blue-500 to-purple-500 mx-auto rounded-full mt-4"></div>
        </div>

        <!-- Form section -->
        <form action="/submit" method="post" class="space-y-4">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </div>
                <input type="text" name="username" placeholder="Enter your name" required
                    class="w-full pl-10 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-400 focus:border-transparent outline-none transition-all duration-200 bg-gray-50 hover:bg-white hover:border-blue-200">
            </div>
            <button type="submit"
                class="w-full bg-gradient-to-r from-blue-500 to-blue-600 text-white font-semibold py-3 px-4 rounded-xl hover:from-blue-600 hover:to-blue-700 transform hover:scale-[1.02] hover:shadow-xl transition-all duration-200 shadow-lg flex items-center justify-center space-x-2 group">
                <svg class="h-5 w-5 group-hover:rotate-12 transition-transform duration-200" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                </svg>
                <span>Submit Form</span>
            </button>
        </form>

        <!-- API section -->
        <div class="relative">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-2 bg-white/80 text-gray-500">or</span>
            </div>
        </div>

        <div class="space-y-4">
            <button onclick="fetchData()"
                class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white font-semibold py-3 px-4 rounded-xl hover:from-purple-600 hover:to-pink-600 transform hover:scale-[1.02] hover:shadow-xl transition-all duration-200 shadow-lg flex items-center justify-center space-x-2 group">
                <svg class="h-5 w-5 group-hover:animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4">
                    </path>
                </svg>
                <span>Get API Data</span>
            </button>

            <!-- Result display -->
            <div id="result"
                class="hidden p-4 bg-gradient-to-r from-gray-50 to-white rounded-xl border-2 border-gray-100 text-gray-700 font-medium text-center transition-all duration-300">
                <!-- Data will appear here -->
            </div>
        </div>
    </div>

    <script>
        function fetchData() {
            const resultElement = document.getElementById("result");

            // Show loading state
            resultElement.classList.remove("hidden");
            resultElement.innerHTML = `
                <div class="flex items-center justify-center space-x-3">
                    <div class="flex space-x-1">
                        <div class="w-2 h-2 bg-blue-500 rounded-full animate-bounce" style="animation-delay: 0s"></div>
                        <div class="w-2 h-2 bg-purple-500 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                        <div class="w-2 h-2 bg-pink-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                    </div>
                    <span class="text-gray-600 font-medium">Fetching data...</span>
                </div>
            `;

            fetch("/api/data")
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    resultElement.innerHTML = `
                        <div class="flex items-center justify-center space-x-2 text-green-600 bg-green-50 p-3 rounded-lg">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                            </svg>
                            <span class="font-semibold">${data.message}</span>
                        </div>
                    `;

                    // Auto-hide after 3 seconds
                    setTimeout(() => {
                        resultElement.classList.add("hidden");
                    }, 3000);
                })
                .catch(error => {
                    resultElement.innerHTML = `
                        <div class="flex items-center justify-center space-x-2 text-red-600 bg-red-50 p-3 rounded-lg">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                            <span class="font-semibold">Error: Could not fetch data</span>
                        </div>
                    `;

                    setTimeout(() => {
                        resultElement.classList.add("hidden");
                    }, 3000);
                });
        }
    </script>
</body>

</html>
