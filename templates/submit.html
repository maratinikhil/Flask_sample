<!DOCTYPE html>
<html>

<head>
    <title>Form Submitted - Flask Sample</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="bg-gradient-to-br from-green-100 via-emerald-50 to-teal-100 min-h-screen flex items-center justify-center p-4">
    <div
        class="max-w-md w-full bg-white/80 backdrop-blur-lg rounded-3xl shadow-2xl p-8 space-y-6 border border-white/20 text-center">
        <!-- Success animation -->
        <div class="relative">
            <div
                class="w-24 h-24 bg-gradient-to-r from-green-400 to-emerald-400 rounded-full mx-auto flex items-center justify-center animate-pulse">
                <svg class="h-12 w-12 text-white animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="w-32 h-32 bg-green-200 rounded-full opacity-20 animate-ping"></div>
            </div>
        </div>

        <!-- Success message -->
        <h1 class="text-3xl font-bold text-gray-800 mt-4">
            Form Submitted Successfully! 🎉
        </h1>

        <div class="bg-gradient-to-r from-green-50 to-emerald-50 p-6 rounded-xl border border-green-100">
            <p class="text-gray-600 mb-2">Thank you for submitting the form</p>
            <div
                class="flex items-center justify-center space-x-2 text-2xl font-bold bg-gradient-to-r from-green-600 to-emerald-600 bg-clip-text text-transparent">
                <svg class="h-8 w-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                <span>{{ username }}</span>
            </div>
        </div>

        <!-- Back button -->
        <a href="/" class="inline-block mt-4 group">
            <button
                class="bg-gradient-to-r from-gray-500 to-gray-600 text-white font-semibold py-3 px-8 rounded-xl hover:from-gray-600 hover:to-gray-700 transform hover:scale-[1.02] hover:shadow-xl transition-all duration-200 shadow-lg flex items-center space-x-2">
                <svg class="h-5 w-5 group-hover:-translate-x-1 transition-transform duration-200" fill="none"
                    stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                <span>Go Back Home</span>
            </button>
        </a>

        <!-- Decorative elements -->
        <div class="flex justify-center space-x-2 mt-6">
            <div class="w-2 h-2 bg-green-400 rounded-full animate-bounce" style="animation-delay: 0s"></div>
            <div class="w-2 h-2 bg-emerald-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
            <div class="w-2 h-2 bg-teal-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
        </div>
    </div>
</body>

</html>
